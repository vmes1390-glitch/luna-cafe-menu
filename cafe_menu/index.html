<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منوی کافه لونا</title>
<style>
        body { 
            font-family: Tahoma, sans-serif; 
            background-color: #3e2723; /* رنگ قهوه‌ای تیره برای کل پس‌زمینه */
            margin: 0; 
            padding: 20px; 
            color: #fff; /* متن‌ها رو سفید می‌کنیم که روی قهوه‌ای خوانا باشه */
        }
        .menu-container { max-width: 600px; margin: auto; }
        h1 { text-align: center; color: #f5f5f5; margin-bottom: 30px; }
        
        /* استایل کارت‌های منو */
        .category { 
            background: #5d4037; /* قهوه‌ای روشن‌تر برای کارت‌ها */
            border-radius: 15px; 
            padding: 20px; 
            margin-bottom: 20px; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.3); 
        }
        .category-title { 
            color: #ffcc80; /* رنگ کرم روشن برای تیترها */
            border-bottom: 2px solid #8d6e63; 
            padding-bottom: 10px; 
            margin-top: 0; 
        }
        
        .item { display: flex; align-items: center; justify-content: space-between; padding: 15px 0; border-bottom: 1px dashed #8d6e63; }
        .item:last-child { border-bottom: none; }
        
        .item-info { display: flex; align-items: center; gap: 15px; }
        .item-image { width: 70px; height: 70px; border-radius: 50%; object-fit: cover; border: 2px solid #ffcc80; }
        .item-details { display: flex; flex-direction: column; }
        .item-name { font-weight: bold; color: #ffffff; font-size: 1.1em; }
        .item-description { font-size: 0.85em; color: #d7ccc8; margin-top: 4px; }
        .item-price { color: #a5d6a7; font-weight: bold; white-space: nowrap; margin-right: 10px; }

        /* لودینگ */
        .spinner { border-top: 4px solid #ffcc80; }
    </style>
</head>
<body>

<div class="menu-container">
    <h1>☕ منوی دیجیتال کافه لونا</h1>
    <div id="menu-content">
        <div class="loader-container">
            <div class="spinner"></div>
            <div class="loading-text">در حال آماده‌سازی منوی کافه لونا...</div>
        </div>
    </div>
</div>

<script>
    const API_URL = '/categories/';
    async function fetchMenu() {
        try {
            const response = await fetch(API_URL);
            const categories = await response.json();
            
            const menuDiv = document.getElementById('menu-content');
            menuDiv.innerHTML = ''; 

            categories.forEach(category => {
                if(category.items.length === 0) return;

                let categoryHTML = `<div class="category">
                                        <h2 class="category-title">${category.name}</h2>`;
                
                category.items.forEach(item => {
                    let priceFormat = new Intl.NumberFormat('fa-IR').format(item.price);
                    categoryHTML += `
                        <div class="item">
                            <div class="item-info">
                                <img src="${item.image_url}" alt="${item.name}" class="item-image" onerror="this.src='https://via.placeholder.com/70'">
                                <div class="item-details">
                                    <span class="item-name">${item.name}</span>
                                    <span class="item-description">${item.description || ''}</span>
                                </div>
                            </div>
                            <span class="item-price">${priceFormat} تومان</span>
                        </div>
                    `;
                });

                categoryHTML += `</div>`;
                menuDiv.innerHTML += categoryHTML;
            });
        } catch (error) {
            document.getElementById('menu-content').innerHTML = `
                <div style="text-align: center; color: red; font-weight: bold;">خطا در ارتباط با سرور!</div>`;
        }
    }
    fetchMenu();
</script>

</body>
</html>
